name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            target: mac
            platform: macOS
            extension: dmg
            executable: release/mac-arm64/Project Pluto.app/Contents/MacOS/Project Pluto
          - label: macOS Intel
            runner: macos-15-intel
            arch: x64
            target: mac
            platform: macOS
            extension: dmg
            executable: release/mac/Project Pluto.app/Contents/MacOS/Project Pluto
          - label: Windows x64
            runner: windows-2025
            arch: x64
            target: win
            platform: Windows
            extension: exe
            executable: release/win-unpacked/Project Pluto.exe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native toolchain
        shell: bash
        run: |
          node -e "require('node:assert/strict').equal(process.arch, '${{ matrix.arch }}')"
          test "$(npm --version)" = "11.19.1"
      - run: npm ci --include=optional
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run build
      - name: Include publisher desktop sign-in registrations
        env:
          PLUTO_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.PLUTO_GOOGLE_DESKTOP_CLIENT_ID }}
          PLUTO_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.PLUTO_GOOGLE_DESKTOP_CLIENT_SECRET }}
          PLUTO_OUTLOOK_DESKTOP_CLIENT_ID: ${{ vars.PLUTO_OUTLOOK_DESKTOP_CLIENT_ID }}
        run: node build/register-oauth.mjs
      - name: Build installer
        run: npm run package:native -- --${{ matrix.target }} --${{ matrix.arch }}
      - name: Native smoke against packaged executable
        shell: bash
        env:
          PLUTO_SMOKE_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
        run: |
          npm run smoke
          npm run smoke:profile
          npm run smoke:sources
          npm run smoke:interactions
          npm run smoke:onboarding
          npm run smoke:job-kit
          npm run smoke:workflows
      - name: Verify packaged app and PDF import
        run: npm run verify:package
      - uses: actions/upload-artifact@v7
        with:
          name: Project-Pluto-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/Project-Pluto-*-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
          compression-level: 0
